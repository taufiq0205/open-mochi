[server]
host = "0.0.0.0"
port = 8080
max_sandbox_timeout_seconds = 86400

[runtime]
type = "docker"
execd_image = "opensandbox/execd:release-1.2.0"
execd_run_as_init = true

[proxy]
resolve_internal = true

[store]
type = "sqlite"
path = "/root/.opensandbox/opensandbox.db"

[storage]
allowed_host_paths = []

[docker]
network_mode = "bridge"
host_ip = "host.docker.internal"
publish_host = "127.0.0.1"
no_new_privileges = true
pids_limit = 512

[egress]
image = "opensandbox/egress:release-1.2.0"
mode = "dns+nft"
disable_ipv6 = true
